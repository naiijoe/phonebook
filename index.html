<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ทำเนียบหมายเลขโทรศัพท์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 font-sans">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30 border-b border-slate-700">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-phone-volume text-sm"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight">สมุดโทรศัพท์ภายใน</h1>
          <p class="text-[11px] text-slate-400">กองเรือยุทธการ (กร.)</p>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <!-- ปุ่มเพิ่มข้อมูล (แสดงเฉพาะ Admin) -->
        <button id="addBtn" onclick="openAddModal()" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow flex items-center gap-1.5 active:scale-95 transition">
          <i class="fa-solid fa-user-plus"></i> เพิ่มข้อมูล
        </button>

        <!-- ปุ่มกุญแจสำหรับ Admin Login / Logout -->
        <button id="authBtn" onclick="handleAuthClick()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 flex items-center justify-center transition border border-slate-700 shadow-sm" title="โหมดจัดการข้อมูล">
          <i class="fa-solid fa-lock text-xs" id="authIcon"></i>
        </button>
      </div>
    </div>

    <!-- Filter Tabs -->
    <div class="max-w-2xl mx-auto px-4 pt-1 pb-2">
      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar" id="categoryTabs">
        <button onclick="filterMainCategory('ALL')" class="cat-btn px-3 py-1.5 rounded-full bg-white text-slate-900 font-semibold whitespace-nowrap shadow-sm" data-cat="ALL">ทั้งหมด</button>
        <button onclick="filterMainCategory('สำนักงานผู้บังคับบัญชาใน บก.กร.')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap" data-cat="สำนักงานผู้บังคับบัญชาใน บก.กร.">สน.ผบช. ใน บก.กร.</button>
        <button onclick="filterMainCategory('ฝ่ายอำนวยการใน บก.กร.')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap" data-cat="ฝ่ายอำนวยการใน บก.กร.">ฝอ./กอง ใน บก.กร.</button>
        <button onclick="filterMainCategory('หน่วยขึ้นตรง กร.')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap" data-cat="หน่วยขึ้นตรง กร.">นขต.กร.</button>
        <button onclick="filterMainCategory('หน่วยงานใน ทร.')" class="cat-btn px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap" data-cat="หน่วยงานใน ทร.">หน่วยงานใน ทร.</button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="max-w-2xl mx-auto px-4 pb-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()"
          placeholder="ค้นหาชื่อ, ตำแหน่ง, เบอร์มือถือ, เบอร์ภายใน 5 ตัว, หน่วยงาน..." 
          class="w-full pl-9 pr-8 py-2 bg-slate-800 text-white placeholder-slate-400 rounded-lg text-xs border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-slate-900 transition"
        >
        <button onclick="clearSearch()" id="clearBtn" class="absolute right-3 top-2.5 text-slate-400 hover:text-white hidden">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="max-w-2xl mx-auto px-3 mt-4">
    <div id="loading" class="text-center py-16 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-indigo-600"></i>
      <p class="text-xs">กำลังดึงข้อมูลทำเนียบเบอร์...</p>
    </div>

    <div id="emptyState" class="text-center py-16 text-slate-400 hidden">
      <i class="fa-regular fa-id-badge text-4xl mb-2 text-slate-300"></i>
      <p class="text-sm font-medium">ไม่พบข้อมูลที่ค้นหา</p>
    </div>

    <div id="groupedContent" class="space-y-6"></div>
  </main>

  <!-- Modal สำหรับเพิ่ม / แก้ไขรายชื่อ -->
  <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-user-pen text-indigo-600"></i> จัดการข้อมูลกำลังพล
        </h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="contactForm" onsubmit="saveContact(event)" class="space-y-3">
        <input type="hidden" id="edit_id" value="">

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">กลุ่มหน่วยงานหลัก *</label>
          <select id="category" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <option value="สำนักงานผู้บังคับบัญชาใน บก.กร.">สำนักงานผู้บังคับบัญชาใน บก.กร.</option>
            <option value="ฝ่ายอำนวยการใน บก.กร.">ฝ่ายอำนวยการใน บก.กร.</option>
            <option value="หน่วยขึ้นตรง กร.">หน่วยขึ้นตรง กร.</option>
            <option value="หน่วยงานใน ทร.">หน่วยงานใน ทร.</option>
          </select>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-slate-700 mb-1">หน่วยงานย่อย / แผนก *</label>
            <input type="text" id="sub_office" required placeholder="เช่น สน.ผบ.กร. หรือ ฝสธ.ประจำ ผบ.กร." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ลำดับ (ตัวเลข)</label>
            <input type="number" id="rank_order" value="1" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ยศ - ชื่อ - นามสกุล *</label>
          <input type="text" id="name" required placeholder="เช่น พล.ร.อ. สมชาย ใจดี" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">ตำแหน่ง</label>
          <input type="text" id="position" placeholder="เช่น ผบ.กร., ฝสธ.ประจำ ผบ.กร." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">เบอร์มือถือ</label>
            <input type="tel" id="phone" placeholder="08xxxxxxxx" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">เบอร์ ทร. (5 ตัว)</label>
            <input type="text" id="internal_phone" placeholder="7xxxx" maxlength="10" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">URL รูปภาพ (ถ้ามี)</label>
          <input type="url" id="avatar_url" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="flex gap-2 pt-3">
          <button type="button" onclick="toggleModal(false)" class="w-1/2 py-2 text-xs font-medium text-slate-600 bg-slate-100 rounded-lg hover:bg-slate-200 transition">ยกเลิก</button>
          <button type="submit" id="saveBtn" class="w-1/2 py-2 text-xs font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow transition">บันทึกข้อมูล</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rkfaypylwaiizprpregy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZmF5cHlsd2FpaXpwcnByZWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDE0ODIsImV4cCI6MjEwMzg3NzQ4Mn0.kUl8Y8LVnBNDVClMRhH_49nrYsXFI_BnRE0ATeU7ORI";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // รหัสผ่านสำหรับ Admin (แก้ไขรหัสผ่านตรงนี้ได้)
    const ADMIN_PIN = "1234";
    let isAdmin = sessionStorage.getItem("admin_authenticated") === "true";

    const SUB_OFFICE_ORDER = [
      "สน.ผบ.กร.",
      "ฝสธ.ประจำ ผบ.กร.",
      "สน.รอง ผบ.กร. (1)",
      "สน.รอง ผบ.กร.(1)",
      "สน.รอง ผบ.กร. (2)",
      "สน.รอง ผบ.กร.(2)",
      "สน.เสธ.กร.",
      "สน.รอง เสธ.กร. (1)",
      "สน.รอง เสธ.กร.(1)",
      "สน.รอง เสธ.กร. (2)",
      "สน.รอง เสธ.กร.(2)",
      "นายพลเรือช่วยปฏิบัติราชการ",

      "กพ.กร.",
      "ขว.กร.",
      "ยก.กร.",
      "กบ.กร.",
      "สสท.บก.กร.",
      "กพร.บก.กร.",
      "คป.กร.",
      "กผช.กร.",
      "ตส.กร.",
      "กง.กร.",
      "ธน.กร.",
      "ธก.บก.กร.",
      "ศปก.กร.",
      "สวัสดิการ กร.",

      "กตอ.กร.",
      "กฟก.1 กร.",
      "กฟก.2 กร.",
      "กบฮ.กร.",
      "กดน.กร.",
      "กทบ.กร.",
      "กยพ.กร.",
      "กยฝ.กร.",
      "กลน.กร.",
      "กบร.กร.",
      "นสร.กร.",
      "กฝร.",
      "กอง สน.กร."
    ];

    const MAIN_CAT_ORDER = [
      "สำนักงานผู้บังคับบัญชาใน บก.กร.",
      "ฝ่ายอำนวยการใน บก.กร.",
      "หน่วยขึ้นตรง กร.",
      "หน่วยงานใน ทร."
    ];

    let allContacts = [];
    let activeMainCategory = 'ALL';

    function updateAuthUI() {
      const addBtn = document.getElementById('addBtn');
      const authIcon = document.getElementById('authIcon');
      const authBtn = document.getElementById('authBtn');

      if (isAdmin) {
        addBtn.classList.remove('hidden');
        authIcon.className = 'fa-solid fa-lock-open text-xs text-amber-400';
        authBtn.classList.add('border-amber-400');
        authBtn.title = "ออกจากโหมดจัดการ (ล็อกเอาท์)";
      } else {
        addBtn.classList.add('hidden');
        authIcon.className = 'fa-solid fa-lock text-xs text-slate-300';
        authBtn.classList.remove('border-amber-400');
        authBtn.title = "เข้าสู่โหมดจัดการข้อมูล (ใส่รหัสผ่าน)";
      }
    }

    function handleAuthClick() {
      if (isAdmin) {
        if (confirm("ต้องการออกจากโหมดจัดการข้อมูลใช่หรือไม่?")) {
          isAdmin = false;
          sessionStorage.removeItem("admin_authenticated");
          updateAuthUI();
          renderData();
        }
      } else {
        const input = prompt("กรุณาใส่รหัสผ่านสำหรับจัดการข้อมูล:");
        if (input === null) return;
        if (input.trim() === ADMIN_PIN) {
          isAdmin = true;
          sessionStorage.setItem("admin_authenticated", "true");
          alert("เข้าสู่โหมดจัดการข้อมูลสำเร็จ");
          updateAuthUI();
          renderData();
        } else {
          alert("รหัสผ่านไม่ถูกต้อง");
        }
      }
    }

    function getSubOfficeRank(name) {
      const cleanName = (name || '').trim();
      const index = SUB_OFFICE_ORDER.indexOf(cleanName);
      return index !== -1 ? index : 999;
    }

    function getMainCatRank(name) {
      const cleanName = (name || '').trim();
      const index = MAIN_CAT_ORDER.indexOf(cleanName);
      return index !== -1 ? index : 999;
    }

    async function fetchContacts() {
      const { data, error } = await client
        .from('contacts')
        .select('*');

      document.getElementById('loading').classList.add('hidden');

      if (error) {
        alert('เกิดข้อผิดพลาด: ' + error.message);
        return;
      }

      allContacts = data || [];
      renderData();
    }

    function filterMainCategory(cat) {
      activeMainCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn px-3 py-1.5 rounded-full bg-white text-slate-900 font-semibold whitespace-nowrap shadow-sm";
        } else {
          btn.className = "cat-btn px-3 py-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 whitespace-nowrap";
        }
      });
      renderData();
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      document.getElementById('clearBtn').classList.toggle('hidden', q === '');
      renderData();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearBtn').classList.add('hidden');
      renderData();
    }

    function renderData() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('groupedContent');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      const filtered = allContacts.filter(item => {
        const matchCat = (activeMainCategory === 'ALL') || (item.category === activeMainCategory);
        const matchQuery = !q || 
          (item.name && item.name.toLowerCase().includes(q)) ||
          (item.position && item.position.toLowerCase().includes(q)) ||
          (item.phone && item.phone.includes(q)) ||
          (item.internal_phone && item.internal_phone.includes(q)) ||
          (item.sub_office && item.sub_office.toLowerCase().includes(q)) ||
          (item.category && item.category.toLowerCase().includes(q));
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const groups = {};
      filtered.forEach(item => {
        const mainCat = item.category || 'หน่วยงานทั่วไป';
        const subCat = (item.sub_office || 'ส่วนกลาง').trim();
        if (!groups[mainCat]) groups[mainCat] = {};
        if (!groups[mainCat][subCat]) groups[mainCat][subCat] = [];
        groups[mainCat][subCat].push(item);
      });

      const sortedMainCats = Object.keys(groups).sort((a, b) => getMainCatRank(a) - getMainCatRank(b));

      sortedMainCats.forEach(mainCat => {
        const subOffices = groups[mainCat];
        const mainSection = document.createElement('div');
        mainSection.className = "space-y-3";
        
        const mainTitle = document.createElement('div');
        mainTitle.className = "flex items-center gap-2 px-1 pt-2 pb-1 border-b-2 border-slate-300 text-slate-800";
        mainTitle.innerHTML = `
          <i class="fa-solid fa-shield-halved text-indigo-700 text-sm"></i>
          <h2 class="text-sm font-extrabold tracking-wide uppercase">${mainCat}</h2>
        `;
        mainSection.appendChild(mainTitle);

        const sortedSubCats = Object.keys(subOffices).sort((a, b) => getSubOfficeRank(a) - getSubOfficeRank(b));

        sortedSubCats.forEach(subCat => {
          const members = subOffices[subCat];
          members.sort((a, b) => (Number(a.rank_order) || 999) - (Number(b.rank_order) || 999));

          let memberRows = '';
          members.forEach(member => {
            const avatarHtml = member.avatar_url 
              ? `<img src="${member.avatar_url}" class="w-11 h-11 rounded-full object-cover border border-slate-200 shrink-0">`
              : `<div class="w-11 h-11 rounded-full bg-slate-100 text-indigo-700 font-bold flex items-center justify-center text-xs shrink-0 border border-slate-200">
                  <i class="fa-solid fa-user-shield text-base"></i>
                 </div>`;

            // แสดงปุ่มแก้ไขและลบเฉพาะตอนเป็น Admin
            const adminButtonsHtml = isAdmin ? `
              <button onclick="editContact(${member.id})" class="w-8 h-8 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 flex items-center justify-center transition" title="แก้ไข">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
              <button onclick="deleteContact(${member.id})" class="w-8 h-8 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 flex items-center justify-center transition" title="ลบ">
                <i class="fa-regular fa-trash-can text-xs"></i>
              </button>
            ` : '';

            memberRows += `
              <div class="p-3 hover:bg-slate-50 flex items-center justify-between gap-3 transition">
                <div class="flex items-center gap-3 min-w-0">
                  ${avatarHtml}
                  <div class="min-w-0">
                    <h4 class="font-bold text-xs sm:text-sm text-slate-800 truncate">${member.name}</h4>
                    <p class="text-[11px] text-indigo-700 font-medium truncate">${member.position || '-'}</p>
                    <div class="flex flex-wrap gap-2 text-[11px] mt-1 text-slate-600">
                      ${member.phone ? `<span class="inline-flex items-center gap-1"><i class="fa-solid fa-mobile-screen text-slate-400"></i> ${member.phone}</span>` : ''}
                      ${member.internal_phone ? `<span class="inline-flex items-center gap-1 bg-amber-50 text-amber-800 border border-amber-200 px-1.5 py-0.2 rounded font-semibold"><i class="fa-solid fa-phone text-[10px]"></i> ทร. ${member.internal_phone}</span>` : ''}
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                  ${member.phone ? `
                    <a href="tel:${member.phone}" class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center hover:bg-emerald-100 active:scale-95 transition shadow-xs" title="โทรออกมือถือ">
                      <i class="fa-solid fa-phone text-xs"></i>
                    </a>
                  ` : ''}
                  ${adminButtonsHtml}
                </div>
              </div>
            `;
          });

          const subCard = document.createElement('div');
          subCard.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
          subCard.innerHTML = `
            <details open class="group">
              <summary class="bg-slate-50 border-b border-slate-200 px-4 py-3 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition">
                <div class="flex items-center gap-2">
                  <i class="fa-solid fa-building text-indigo-600 text-xs"></i>
                  <span class="text-xs sm:text-sm font-bold text-slate-800">${subCat}</span>
                  <span class="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full">${members.length}</span>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400 group-open:rotate-0 -rotate-90 transition-transform"></i>
              </summary>
              <div class="divide-y divide-slate-100">
                ${memberRows}
              </div>
            </details>
          `;
          mainSection.appendChild(subCard);
        });

        container.appendChild(mainSection);
      });
    }

    function toggleModal(show) {
      const modal = document.getElementById('modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
        document.getElementById('contactForm').reset();
        document.getElementById('edit_id').value = '';
      }
    }

    function openAddModal() {
      if (!isAdmin) {
        alert("คุณไม่มีสิทธิ์เพิ่มข้อมูล");
        return;
      }
      document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-plus text-indigo-600"></i> เพิ่มข้อมูลกำลังพล';
      document.getElementById('saveBtn').innerText = 'บันทึกข้อมูล';
      document.getElementById('contactForm').reset();
      document.getElementById('edit_id').value = '';
      document.getElementById('rank_order').value = 1;
      toggleModal(true);
    }

    function editContact(id) {
      if (!isAdmin) {
        alert("คุณไม่มีสิทธิ์แก้ไขข้อมูล");
        return;
      }
      const contact = allContacts.find(c => c.id === id);
      if (!contact) return;

      document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-pen text-indigo-600"></i> แก้ไขข้อมูลกำลังพล';
      document.getElementById('saveBtn').innerText = 'อัปเดตข้อมูล';

      document.getElementById('edit_id').value = contact.id;
      document.getElementById('category').value = contact.category || 'สำนักงานผู้บังคับบัญชาใน บก.กร.';
      document.getElementById('sub_office').value = contact.sub_office || '';
      document.getElementById('rank_order').value = contact.rank_order || 1;
      document.getElementById('name').value = contact.name || '';
      document.getElementById('position').value = contact.position || '';
      document.getElementById('phone').value = contact.phone || '';
      document.getElementById('internal_phone').value = contact.internal_phone || '';
      document.getElementById('avatar_url').value = contact.avatar_url || '';

      toggleModal(true);
    }

    async function saveContact(e) {
      e.preventDefault();
      if (!isAdmin) {
        alert("คุณไม่มีสิทธิ์บันทึกข้อมูล");
        return;
      }

      const saveBtn = document.getElementById('saveBtn');
      const editId = document.getElementById('edit_id').value;

      saveBtn.disabled = true;
      saveBtn.innerText = editId ? 'กำลังอัปเดต...' : 'กำลังบันทึก...';

      const payload = {
        category: document.getElementById('category').value,
        sub_office: document.getElementById('sub_office').value.trim(),
        rank_order: parseInt(document.getElementById('rank_order').value) || 1,
        name: document.getElementById('name').value.trim(),
        position: document.getElementById('position').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        internal_phone: document.getElementById('internal_phone').value.trim(),
        avatar_url: document.getElementById('avatar_url').value.trim() || null
      };

      let result;
      if (editId) {
        result = await client.from('contacts').update(payload).eq('id', editId);
      } else {
        result = await client.from('contacts').insert([payload]);
      }

      saveBtn.disabled = false;
      saveBtn.innerText = editId ? 'อัปเดตข้อมูล' : 'บันทึกข้อมูล';

      if (result.error) {
        alert('เกิดข้อผิดพลาด: ' + result.error.message);
      } else {
        toggleModal(false);
        fetchContacts();
      }
    }

    async function deleteContact(id) {
      if (!isAdmin) {
        alert("คุณไม่มีสิทธิ์ลบข้อมูล");
        return;
      }
      if (confirm('คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
        const { error } = await client.from('contacts').delete().eq('id', id);
        if (error) {
          alert('ลบไม่สำเร็จ: ' + error.message);
        } else {
          fetchContacts();
        }
      }
    }

    // เริ่มต้นระบบ
    updateAuthUI();
    fetchContacts();
  </script>
</body>
</html>

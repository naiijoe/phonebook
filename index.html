<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมุดโทรศัพท์</title>
  <!-- Tailwind CSS สำหรับจัดหน้าตาให้สวยงามแบบคลีนๆ ไร้โฆษณา -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        <i class="fa-solid fa-address-book"></i> สมุดโทรศัพท์
      </h1>
      <button onclick="toggleModal(true)" class="bg-white text-indigo-600 px-3 py-1.5 rounded-full font-medium text-sm shadow hover:bg-slate-100 active:scale-95 transition">
        <i class="fa-solid fa-plus"></i> เพิ่มเบอร์
      </button>
    </div>
    <!-- Search Bar -->
    <div class="max-w-md mx-auto px-4 pb-4">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput" 
          oninput="handleSearch()"
          placeholder="ค้นหาชื่อ, เบอร์โทร, แผนก..." 
          class="w-full pl-10 pr-4 py-2 bg-white text-slate-900 rounded-xl text-sm shadow-inner focus:outline-none focus:ring-2 focus:ring-indigo-300"
        >
      </div>
    </div>
  </header>

  <!-- Content List -->
  <main class="max-w-md mx-auto px-4 mt-4">
    <div id="loading" class="text-center py-10 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-indigo-500"></i>
      <p class="text-sm">กำลังโหลดรายชื่อ...</p>
    </div>

    <div id="contactList" class="space-y-3 hidden">
      <!-- ข้อมูลจะแสดงตรงนี้อัตโนมัติ -->
    </div>

    <div id="emptyState" class="text-center py-12 text-slate-400 hidden">
      <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
      <p class="text-sm">ยังไม่พบรายชื่อในระบบ</p>
    </div>
  </main>

  <!-- Modal สำหรับเพิ่มรายชื่อ -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800">เพิ่มรายชื่อใหม่</h3>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="contactForm" onsubmit="saveContact(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อ-นามสกุล *</label>
          <input type="text" id="name" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">เบอร์โทรศัพท์ *</label>
          <input type="tel" id="phone" required class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">หมวดหมู่ / แผนก</label>
          <input type="text" id="category" placeholder="เช่น ครอบครัว, ฝ่ายขาย, ลูกค้า" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="toggleModal(false)" class="w-1/2 py-2 text-sm text-slate-600 bg-slate-100 rounded-lg font-medium hover:bg-slate-200">ยกเลิก</button>
          <button type="submit" id="saveBtn" class="w-1/2 py-2 text-sm text-white bg-indigo-600 rounded-lg font-medium hover:bg-indigo-700">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // เชื่อมต่อฐานข้อมูล Supabase อัตโนมัติด้วย Key ของคุณ
    const SUPABASE_URL = "https://rkfaypylwaiizprpregy.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJrZmF5cHlsd2FpaXpwcnByZWd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMDE0ODIsImV4cCI6MjEwMzg3NzQ4Mn0.kUl8Y8LVnBNDVClMRhH_49nrYsXFI_BnRE0ATeU7ORI";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allContacts = [];

    async function fetchContacts() {
      const { data, error } = await client
        .from('contacts')
        .select('*')
        .order('name', { ascending: true });

      document.getElementById('loading').classList.add('hidden');

      if (error) {
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + error.message);
        return;
      }

      allContacts = data || [];
      renderContacts(allContacts);
    }

    function renderContacts(contacts) {
      const list = document.getElementById('contactList');
      const emptyState = document.getElementById('emptyState');
      list.innerHTML = '';

      if (contacts.length === 0) {
        list.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      list.classList.remove('hidden');

      contacts.forEach(contact => {
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-sm">
              ${contact.name.charAt(0)}
            </div>
            <div>
              <h4 class="font-semibold text-sm text-slate-800 leading-tight">${contact.name}</h4>
              <p class="text-xs text-slate-500 mt-0.5">${contact.phone}</p>
              ${contact.category ? `<span class="inline-block bg-slate-100 text-slate-600 text-[10px] px-2 py-0.5 rounded-full mt-1 font-medium">${contact.category}</span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-2">
            <a href="tel:${contact.phone}" class="w-9 h-9 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center hover:bg-emerald-100 active:scale-95 transition shadow-sm" title="โทรออก">
              <i class="fa-solid fa-phone text-sm"></i>
            </a>
            <button onclick="deleteContact(${contact.id})" class="w-8 h-8 rounded-full text-slate-300 hover:text-rose-500 flex items-center justify-center transition" title="ลบ">
              <i class="fa-regular fa-trash-can text-sm"></i>
            </button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allContacts.filter(c => 
        (c.name && c.name.toLowerCase().includes(q)) || 
        (c.phone && c.phone.includes(q)) ||
        (c.category && c.category.toLowerCase().includes(q))
      );
      renderContacts(filtered);
    }

    function toggleModal(show) {
      const modal = document.getElementById('modal');
      if (show) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
        document.getElementById('contactForm').reset();
      }
    }

    async function saveContact(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'กำลังบันทึก...';

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const category = document.getElementById('category').value.trim();

      const { error } = await client.from('contacts').insert([{ name, phone, category }]);

      saveBtn.disabled = false;
      saveBtn.innerText = 'บันทึก';

      if (error) {
        alert('เกิดข้อผิดพลาด: ' + error.message);
      } else {
        toggleModal(false);
        fetchContacts();
      }
    }

    async function deleteContact(id) {
      if (confirm('คุณต้องการลบรายชื่อนี้ใช่หรือไม่?')) {
        const { error } = await client.from('contacts').delete().eq('id', id);
        if (error) {
          alert('ลบไม่สำเร็จ: ' + error.message);
        } else {
          fetchContacts();
        }
      }
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    fetchContacts();
  </script>
</body>
</html>
